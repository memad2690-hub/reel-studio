<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Cairo;src:url("Cairo-Variable.ttf");font-weight:200 1000}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;font-family:Cairo;background:#111}
.ph{position:absolute;left:-150px;top:-430px;width:1380px}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(17,17,17,0) 0,rgba(17,17,17,0) 48%,rgba(17,17,17,.85) 60%,rgba(17,17,17,.96) 100%)}
.box{position:absolute;left:0;right:0;top:1110px;text-align:center;direction:rtl}
.row{display:flex;justify-content:center;align-items:center;gap:26px;direction:ltr}
.chip{font-weight:900;font-size:88px;line-height:1;padding:22px 34px 30px;border-radius:26px;letter-spacing:1px}
.c1{background:#2f5d8a;color:#fff}.c2{background:#f2cf4a;color:#222}
.vs{width:104px;height:104px;border-radius:50%;background:#fff;color:#222;font-weight:1000;font-size:46px;display:flex;align-items:center;justify-content:center}
h1{margin-top:44px;font-weight:1000;font-size:164px;line-height:1;color:#fff}
h1 span{display:inline-block;background:#f2cf4a;color:#222;padding:0 24px;line-height:1.18;border-radius:20px}
.sub{margin-top:30px;font-weight:800;font-size:56px;color:#f4eddd;opacity:.92}
</style></head><body>
<img class="ph" src="frame_graded.jpg"><div class="shade"></div>
<div class="box">
 <div class="row"><div class="chip c1">CPM 40</div><div class="vs">VS</div><div class="chip c2">CPM 80</div></div>
 <h1>إيه <span>أحسن؟</span></h1>
 <div class="sub">مقارنة حملتين</div>
</div></body></html>
